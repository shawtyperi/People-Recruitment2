    const EVALUATOR_ROLES = [
      "Hiring Manager (ผู้บังคับบัญชาสายงาน)",
      "Committee Member (กรรมการสัมภาษณ์)",
      "Technical Specialist (ผู้เชี่ยวชาญเฉพาะทาง)",
      "HR Interviewer (ฝ่ายทรัพยากรบุคคล)",
      "Department Director (ผู้อำนวยการฝ่ายงาน)"
    ];

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

        case "lock":

        case "shieldCheck":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
        case "sun":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;

          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>;
        case "x":

        const approverEmail = targetReq.approverEmail || reqOrSlot.approverEmail;

        if (!approverEmail || !approverEmail.includes("@")) {
          triggerToast("⚠️ ไม่พบอีเมลผู้อนุมัติที่ถูกต้องในคำขอนี้");
          return;
        }

        try {
          setIsApprovingEmailSending(true);
          triggerToast(`⏳ กำลังส่งอีเมลขออนุมัติไปยัง ${approverEmail}...`);

          setRequests(prev => prev.map(r => {
            if (r.id === parentReqId) {
              const updatedSlots = (r.slots || []).map(s => ({
                ...s,
                slotStatus: "PENDING_APPROVER",
                workflowStatus: "PENDING_APPROVER"
              }));
              return {
                ...r,
                requestStatus: "PENDING_APPROVER",
                workflowStatus: "PENDING_APPROVER",
                slots: updatedSlots,
                lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
              };
            }
            return r;
          }));

          if (googleScriptUrl) {
            await fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "sendApproverEmail",
                reqId: parentReqId,
                jobTitle: targetReq.jobTitle,
                department: targetReq.department,
                headcountRequired: targetReq.headcountRequired || 1,
                positionType: targetReq.positionType,
                approverName: targetReq.approverName,
                approverEmail: approverEmail,
                targetDate: targetReq.targetDate
              })
            });
          }

          setShowAdminReviewModal(false);
          setSelectedAdminReviewSlot(null);
          if (selectedRequisitionDetail && selectedRequisitionDetail.id === parentReqId) {
            setSelectedRequisitionDetail(prev => ({
              ...prev,
              requestStatus: "PENDING_APPROVER",
              workflowStatus: "PENDING_APPROVER"
            }));
          }
          triggerToast(`📧 ส่งอีเมลไปยังผู้อนุมัติเรียบร้อยแล้ว (สถานะ: PENDING_APPROVER)`);
        } catch (err) {
          triggerToast("บันทึกสถานะเป็น PENDING_APPROVER เรียบร้อยแล้ว");
        } finally {
          setIsApprovingEmailSending(false);
        }
      };

      const allPositionSlots = useMemo(() => {
        return requests.flatMap(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          const slots = (r.slots && r.slots.length === headcount) 
            ? r.slots 
            : Array.from({ length: headcount }, (_, i) => ({
                slotId: `${r.id}-${i + 1}`,
                slotIndex: i + 1,
                slotStatus: r.requestStatus || "Recruiting",
                candidateName: "",
                candidatePhone: "",
                candidateNickname: "",
                resumeUrl: "",
                stage: r.stage || "received",
                offerSentDate: "",
                hireDate: "",
                interviewSchedule: "",
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                onboardingArrivalStatus: r.onboardingArrivalStatus || "pending_arrival",
                rejectionReason: r.rejectionReason || "",
                evaluations: []
              }));

          return slots.map(slot => {
            const matchedCand = candidatePool.find(c => c.assignedSlotId === slot.slotId || (slot.candidateName && c.fullName === slot.candidateName));
            const currentEvals = slot.evaluations || [];
            const evalStats = calculateOverallScore(currentEvals);

            const isCancelled = (slot.stage || r.stage) === "cancelled";
            const arrivalStatus = isCancelled
              ? "declined_noshow"
              : (slot.onboardingArrivalStatus || r.onboardingArrivalStatus || "pending_arrival");

            const currentWorkflowStatus = slot.workflowStatus || r.workflowStatus || slot.slotStatus || r.requestStatus || "PENDING_ADMIN";
            const isPendingApproval = currentWorkflowStatus === "PENDING_ADMIN" || 
                                      currentWorkflowStatus === "PENDING_APPROVER" || 
                                      currentWorkflowStatus === "PENDING_IT";

            let initialStage = slot.stage || r.stage || "received";
            let effectiveStage = initialStage;
            if (isPendingApproval) {
              effectiveStage = "received";
            } else if ((currentWorkflowStatus === "READY_FOR_RECRUITMENT" || currentWorkflowStatus === "Recruiting") && initialStage === "received") {
              effectiveStage = "manpower";
            }

            const slotEffectiveStatus = (slot.slotStatus === "Closed" || effectiveStage === "onboarded" || effectiveStage === "cancelled")
              ? "Closed"
              : (slot.slotStatus || r.requestStatus || "Recruiting");

            return {
              ...r,
              slotId: slot.slotId,
              slotIndex: slot.slotIndex,
              totalSlots: headcount,
              slotStatus: slotEffectiveStatus,
              workflowStatus: currentWorkflowStatus,
              requestStatus: slotEffectiveStatus,
              parentRequestId: r.id,
              candidateName: slot.candidateName || "",
              candidatePhone: slot.candidatePhone || "",
              candidateNickname: slot.candidateNickname || "",
              resumeUrl: slot.resumeUrl || "",
              stage: effectiveStage,
              offerSentDate: slot.offerSentDate || r.offerSentDate || "",
              interviewSchedule: slot.interviewSchedule || matchedCand?.interviewDate || "",
              interviewScore: currentEvals.length > 0 ? evalStats.combinedAvg : (slot.interviewScore || 0),
              interviewScorePercent: currentEvals.length > 0 ? evalStats.combinedPct : (slot.interviewScorePercent || 0),
              interviewResult: currentEvals.length > 0 ? evalStats.result : (slot.interviewResult || ""),
              evaluations: currentEvals,
              evaluationsCount: currentEvals.length,
              replacedEmployeeName: r.replacedEmployeeName || "",
              hireDate: matchedCand?.hireDate || slot.hireDate || "",
              onboardingArrivalStatus: arrivalStatus,
              rejectionReason: slot.rejectionReason || r.rejectionReason || "",
              isArchivedFromKanban: !!slot.isArchivedFromKanban
            };
          });
        });
      }, [requests, candidatePool]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-normal mt-0.5">
                      ระบบติดตามการสรรหา & SLA Lead Time (เป้าหมาย 30 วันทำการ)
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition">
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  <button onClick={() => setShowRequestModal(true)} className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition">
                    <Icon name="plus" className="w-4 h-4 text-white" />
                    <span>+ ขอกำลังคน</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <div className="p-8 text-center bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
              <h2 className="text-lg font-bold text-slate-900 dark:text-white">🚀 HR Recruitment System Ready</h2>
              <p className="text-xs text-slate-500 mt-1">ระบบได้รับการปรับปรุงรองรับ Approval & IT Workflow แบบครบวงจรเรียบร้อยแล้ว</p>
            </div>
          </main>

          {/* IT Specific Modal when opened via IT Deep Link (?viewReqId=...&role=it) */}
          {selectedITModalReq && (
            <div className="fixed inset-0 z-[85] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-purple-300 dark:border-purple-800 overflow-hidden max-h-[92vh] flex flex-col">
                <div className="px-6 py-4 bg-gradient-to-r from-purple-700 to-indigo-700 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-purple-200">
                      IT EQUIPMENT PROCUREMENT CONFIRMATION
                    </span>
                    <h3 className="text-base font-extrabold mt-0.5">
                      💻 ยืนยันการจัดเตรียมอุปกรณ์ IT (Req: {selectedITModalReq.id})
                    </h3>
                  </div>
                  <button onClick={() => setSelectedITModalReq(null)} className="p-1.5 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  <div className="p-3.5 rounded-2xl bg-purple-50/70 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-800 space-y-1.5">
                    <p><span className="text-slate-400">ตำแหน่งงาน:</span> <strong className="text-slate-900 dark:text-white text-sm">{selectedITModalReq.jobTitle}</strong></p>
                    <p><span className="text-slate-400">ฝ่ายงาน:</span> <strong className="text-purple-700 dark:text-purple-300">{selectedITModalReq.department}</strong></p>
                    <p><span className="text-slate-400">จำนวนอัตรา:</span> <strong className="text-slate-900 dark:text-white">{selectedITModalReq.headcountRequired || 1} อัตรา</strong></p>
                    <p><span className="text-slate-400">กำหนดต้องพร้อมใช้งานภายใน:</span> <strong className="text-amber-600 font-bold">{selectedITModalReq.targetDate || "-"}</strong></p>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                    <span className="text-[10.5px] font-bold text-slate-500 uppercase block">รายการอุปกรณ์และสิทธิ์ที่ต้องจัดเตรียม:</span>
                    <div className="grid grid-cols-2 gap-2 text-[11px]">
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span className="text-slate-400 block text-[10px]">Laptop / PC:</span>
                        <strong className="text-purple-600 font-bold">{selectedITModalReq.itLaptop || "ต้องการ"}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span className="text-slate-400 block text-[10px]">Sim Card:</span>
                        <strong className="text-purple-600 font-bold">{selectedITModalReq.itSimCard || "ไม่ต้องการ"}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span className="text-slate-400 block text-[10px]">Corporate Email:</span>
                        <strong className="text-purple-600 font-bold">{selectedITModalReq.itEmail || "ต้องการ"}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span className="text-slate-400 block text-[10px]">ERP Netsuite:</span>
                        <strong className="text-purple-600 font-bold">{selectedITModalReq.itNetsuite || "ไม่ต้องการ"}</strong>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button onClick={() => setSelectedITModalReq(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600">
                    ปิด
                  </button>
                  <button
                    onClick={() => handleITConfirmReadyForRecruitment(selectedITModalReq)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-purple-600 hover:bg-purple-700 shadow-md transition active:scale-95"
                  >
                    💻 ยืนยันการจัดเตรียมอุปกรณ์เรียบร้อย (READY_FOR_RECRUITMENT)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
