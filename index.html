    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

        case "lock":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>;
        case "shieldCheck":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
        case "sun":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;

        case "x":

                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5">
                      <span>HR Recruitment Dashboard</span>
                    </h1>
                    <p className="text-xs text-slate-500">Automated Approval Workflow & Headcount Tracking</p>
                  </div>
                </div>

                <div className="flex items-center space-x-3">
                  <button
                    onClick={() => syncWorkflowStatus(false)}
                    className="px-3 py-2 rounded-xl text-xs font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center gap-1.5 shadow-2xs hover:bg-slate-100 transition"
                  >
                    <Icon name="refresh" className="w-4 h-4 text-brand-600" />
                    <span>ซิงค์สถานะอนุมัติ</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 p-6 shadow-sm">
              <h2 className="text-base font-bold text-slate-900 dark:text-white mb-4">
                Interactive Kanban Pipeline
              </h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {allPositionSlots.map(slot => (
                  <div key={slot.slotId} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-brand-600">{slot.slotId}</span>
                      <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">
                        {slot.workflowStatus}
                      </span>
                    </div>
                    <h4 className="font-bold text-sm text-slate-900 dark:text-white">{slot.jobTitle}</h4>
                    <p className="text-xs text-slate-500">{slot.department}</p>
                    <button
                      onClick={() => setSelectedDetailSlot(slot)}
                      className="mt-2 w-full py-1.5 rounded-xl bg-brand-600 text-white font-bold text-xs"
                    >
                      ดูรายละเอียดคำขอ
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </main>

          {/* Slot Detail Modal with Dynamic Live Status Progress Tracker */}
          {selectedDetailSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold text-brand-600 uppercase">{selectedDetailSlot.slotId}</span>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-0.5">{selectedDetailSlot.jobTitle}</h3>
                    <p className="text-xs text-slate-500">{selectedDetailSlot.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailSlot(null)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-4 text-xs">
                  {/* Progress Tracker using Live State Calculation */}
                  {(() => {
                    const currentReq = requests.find(r => r.id === (selectedDetailSlot?.parentRequestId || selectedDetailSlot?.id));
                    const liveStatus = currentReq?.workflowStatus || selectedDetailSlot?.workflowStatus || "PENDING_ADMIN";

                    const isStep1Done = true;
                    const isStep2Done = liveStatus === "PENDING_APPROVER" || liveStatus === "PENDING_IT" || liveStatus === "READY_FOR_RECRUITMENT" || liveStatus === "Recruiting" || selectedDetailSlot.stage !== "received";
                    const isStep3Done = liveStatus === "PENDING_IT" || liveStatus === "READY_FOR_RECRUITMENT" || liveStatus === "Recruiting" || selectedDetailSlot.stage !== "received";
                    const isStep4Done = liveStatus === "READY_FOR_RECRUITMENT" || liveStatus === "Recruiting" || (selectedDetailSlot.stage !== "received" && selectedDetailSlot.stage !== "manpower");

                    return (
                      <div className="p-4 rounded-2xl bg-gradient-to-br from-slate-50 to-sky-50/40 dark:from-slate-800/80 dark:to-sky-950/30 border border-slate-200 dark:border-slate-700 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                            <Icon name="clipboardCheck" className="w-4 h-4 text-brand-600" />
                            <span>APPROVAL WORKFLOW PROGRESS TRACKER</span>
                          </span>
                          <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${
                            liveStatus === "PENDING_ADMIN" ? "bg-amber-100 text-amber-900 border-amber-300 dark:bg-amber-950 dark:text-amber-300" :
                            liveStatus === "PENDING_APPROVER" ? "bg-orange-100 text-orange-900 border-orange-300 dark:bg-orange-950 dark:text-orange-300" :
                            liveStatus === "PENDING_IT" ? "bg-sky-100 text-sky-900 border-sky-300 dark:bg-sky-950 dark:text-sky-300" :
                            liveStatus === "REJECTED_BY_APPROVER" ? "bg-rose-100 text-rose-900 border-rose-300 dark:bg-rose-950 dark:text-rose-300" :
                            "bg-emerald-100 text-emerald-900 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300"
                          }`}>
                            {liveStatus === "PENDING_ADMIN" ? "⏳ รอ Admin ตรวจสอบ" :
                             liveStatus === "PENDING_APPROVER" ? "📧 รอผู้อนุมัติยืนยัน" :
                             liveStatus === "PENDING_IT" ? "💻 รอ IT จัดเตรียมอุปกรณ์" :
                             liveStatus === "REJECTED_BY_APPROVER" ? "❌ ผู้อนุมัติปฏิเสธคำขอ" :
                             "✅ พร้อมสรรหา (READY_FOR_RECRUITMENT)"}
                          </span>
                        </div>

                        <div className="grid grid-cols-4 gap-2 pt-1 text-center">
                          <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800">
                            <div className="w-5 h-5 rounded-full bg-emerald-500 text-white text-[10px] font-bold flex items-center justify-center mx-auto mb-1">✓</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">1. ยื่นคำขอ</span>
                            <span className="text-[9px] text-emerald-600 font-semibold block">{selectedDetailSlot.requestDate}</span>
                          </div>

                          <div className={`p-2 rounded-xl border ${
                            isStep2Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            liveStatus === "PENDING_ADMIN" ? "bg-amber-50 dark:bg-amber-950/60 border-amber-300 ring-2 ring-amber-500/20" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep2Done ? "bg-emerald-500 text-white" :
                              liveStatus === "PENDING_ADMIN" ? "bg-amber-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep2Done ? "✓" : "2"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">2. Admin ตรวจ</span>
                            <span className={`text-[9px] font-semibold block ${isStep2Done ? "text-emerald-600" : "text-amber-600"}`}>
                              {isStep2Done ? "อนุมัติแล้ว" : "กำลังรอตรวจ"}
                            </span>
                          </div>

                          <div className={`p-2 rounded-xl border ${
                            liveStatus === "REJECTED_BY_APPROVER" ? "bg-rose-50 border-rose-300 text-rose-700" :
                            isStep3Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            liveStatus === "PENDING_APPROVER" ? "bg-orange-50 dark:bg-orange-950/60 border-orange-300 ring-2 ring-orange-500/20" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              liveStatus === "REJECTED_BY_APPROVER" ? "bg-rose-500 text-white" :
                              isStep3Done ? "bg-emerald-500 text-white" :
                              liveStatus === "PENDING_APPROVER" ? "bg-orange-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{liveStatus === "REJECTED_BY_APPROVER" ? "✕" : isStep3Done ? "✓" : "3"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">3. ผู้อนุมัติ</span>
                            <span className={`text-[9px] font-semibold block ${
                              liveStatus === "REJECTED_BY_APPROVER" ? "text-rose-600 font-bold" :
                              isStep3Done ? "text-emerald-600" :
                              liveStatus === "PENDING_APPROVER" ? "text-orange-600" : "text-slate-400"
                            }`}>
                              {liveStatus === "REJECTED_BY_APPROVER" ? "ปฏิเสธคำขอ" : isStep3Done ? "ยืนยันแล้ว" : liveStatus === "PENDING_APPROVER" ? "รออีเมลยืนยัน" : "รอคิว"}
                            </span>
                          </div>

                          <div className={`p-2 rounded-xl border ${
                            isStep4Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            liveStatus === "PENDING_IT" ? "bg-sky-50 dark:bg-sky-950/60 border-sky-300 ring-2 ring-sky-500/20" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep4Done ? "bg-emerald-500 text-white" :
                              liveStatus === "PENDING_IT" ? "bg-sky-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep4Done ? "✓" : "4"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">4. IT ยืนยัน</span>
                            <span className={`text-[9px] font-semibold block ${isStep4Done ? "text-emerald-600" : liveStatus === "PENDING_IT" ? "text-sky-600" : "text-slate-400"}`}>
                              {isStep4Done ? "อุปกรณ์พร้อม" : liveStatus === "PENDING_IT" ? "รอ IT ยืนยัน" : "รอคิว"}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                          <span className="text-[10px] text-slate-400">สถานะจะอัปเดตอัตโนมัติเมื่อกดจากอีเมล</span>
                          <button
                            type="button"
                            onClick={() => syncWorkflowStatus(false)}
                            className="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 hover:bg-slate-100 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 text-[10px] font-bold flex items-center gap-1 transition"
                          >
                            <Icon name="refresh" className="w-3 h-3 text-brand-600" />
                            <span>🔄 ซิงค์สถานะอนุมัติ</span>
                          </button>
                        </div>
                      </div>
                    );
                  })()}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setSelectedDetailSlot(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
