                  <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                      คุณสมบัติผู้สมัคร &amp; ลักษณะงาน (Applicant Requirements)
                    </span>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[10px]">เพศ:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.gender || "ไม่ระบุ"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">อายุ:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.age || "ไม่จำกัด"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">การศึกษา:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.educationLevel || "ปริญญาตรี"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">สาขาวิชา:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.major || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">ประสบการณ์:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.experience || "1-3 ปี"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">เป้าหมายเริ่มงาน:</span>
                        <strong className="text-brand-600">{selectedDetailSlot.targetDate || "-"}</strong>
                      </div>
                    </div>
                    {selectedDetailSlot.mustHaveQualifications && (
                      <div className="pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                        <span className="text-slate-400 block text-[10px] font-semibold">คุณสมบัติที่จำเป็น (Must-have):</span>
                        <p className="text-slate-700 dark:text-slate-300 text-[11px] mt-0.5">{selectedDetailSlot.mustHaveQualifications}</p>
                      </div>
                    )}
                    {selectedDetailSlot.jobDescription && (
                      <div className="pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                        <span className="text-slate-400 block text-[10px] font-semibold">ลักษณะงานโดยย่อ (JD):</span>
                        <p className="text-slate-700 dark:text-slate-300 text-[11px] mt-0.5">{selectedDetailSlot.jobDescription}</p>
                      </div>
                    )}
                  </div>
                  {/* IT & Equipment Requirements Details */}
                  <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                      💻 อุปกรณ์และสิทธิ์ IT ที่ร้องขอ (IT &amp; Equipment Requirements)
                    </span>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-[10px]">
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itLaptop === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>Laptop / PC</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itLaptop || "ต้องการ"}</strong>
                      </div>
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itSimCard === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>Sim / โทรศัพท์</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itSimCard || "ไม่ต้องการ"}</strong>
                      </div>
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itEmail === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>Email องค์กร</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itEmail || "ต้องการ"}</strong>
                      </div>
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itNetsuite === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>ERP Netsuite</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itNetsuite || "ไม่ต้องการ"}</strong>
                      </div>
                    </div>
                  </div>
                  {/* Arrival Status & Inspection in Closed state */}
                  {(selectedDetailSlot.slotStatus === "Closed" || selectedDetailSlot.stage === "cancelled") && (
                    <div className={`p-3.5 rounded-2xl border ${
                      (selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow")
                        ? "bg-rose-50 dark:bg-rose-950/50 border-rose-400 ring-2 ring-rose-500/20"
                        : selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"
                        ? "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-400 ring-2 ring-emerald-500/20"
                        : "bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                    }`}>
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-[10px] font-extrabold uppercase text-slate-400">
                            สถานะการมารายงานตัวเข้าทำงาน (Onboarding Arrival Status)
                          </span>
                          {selectedDetailSlot.hireDate && selectedDetailSlot.stage !== "cancelled" && (
                            <p className="text-xs font-bold text-emerald-700 dark:text-emerald-300 mt-0.5">
                              🎉 วันเริ่มงาน: {selectedDetailSlot.hireDate}
                            </p>
                          )}
                          {(selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow") && (
                            <p className="text-xs font-bold text-rose-600 dark:text-rose-400 mt-0.5">
                              ❌ ตำแหน่งถูกยกเลิก / ผู้สมัครสละสิทธิ์
                            </p>
                          )}
                        </div>
                        <div className="flex items-center gap-1">
                          <select
                            disabled={selectedDetailSlot.onboardingArrivalStatus === "declined_noshow"}
                            value={selectedDetailSlot.onboardingArrivalStatus || "pending_arrival"}
                            onChange={(e) => handleUpdateOnboardingArrivalStatus(selectedDetailSlot.slotId, e.target.value)}
                            className={`text-xs font-extrabold px-3 py-1.5 rounded-xl border transition ${
                              selectedDetailSlot.onboardingArrivalStatus === "declined_noshow"
                                ? "bg-rose-600 text-white border-rose-700 shadow-sm ring-2 ring-rose-500/20 cursor-not-allowed opacity-95"
                                : selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"
                                ? "bg-emerald-600 text-white border-emerald-700"
                                : "bg-amber-100 text-amber-900 border-amber-300"
                            }`}
                          >
                            {ONBOARDING_ARRIVAL_STATUSES.map(arr => (
                              <option key={arr.id} value={arr.id}>{arr.label}</option>
                            ))}
                          </select>
                          {selectedDetailSlot.onboardingArrivalStatus === "declined_noshow" && (
                            <span className="text-xs text-rose-600 font-bold" title="สถานะถูกล็อกแล้ว">🔒</span>
                          )}
                        </div>
                      </div>
                      {selectedDetailSlot.onboardingArrivalStatus === "arrived_reported" && selectedDetailSlot.stage !== "cancelled" && (
                        <div className="mt-2 text-[11px] font-bold text-emerald-700 dark:text-emerald-300 flex items-center gap-1.5">
                          <Icon name="badgeCheck" className="w-4 h-4 text-emerald-600" />
                          <span>ตำแหน่งนี้ปิดงานสมบูรณ์ 100% (พนักงานมารายงานตัวเรียบร้อยแล้ว)</span>
                        </div>
                      )}
                      {(selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow") && (
                        <div className="mt-2 text-[11px] font-bold text-rose-700 dark:text-rose-300 flex items-center gap-1.5">
                          <Icon name="exclamation" className="w-4 h-4 text-rose-600" />
                          <span>สละสิทธิ์ / ไม่มาเริ่มงาน (ตำแหน่งถูกปิดเป็น Rejected/Cancelled พร้อมล็อกสถานะ)</span>
                        </div>
                      )}
                    </div>
                  )}
                  {selectedDetailSlot.candidateName ? (
                    <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <p className="font-bold text-emerald-900 dark:text-emerald-200 text-sm">👤 แคนดิเดต: {selectedDetailSlot.candidateName}</p>
                        {isAdminAuthenticated && (
                          <button
                            onClick={() => {
                              const slot = selectedDetailSlot;
                              setSelectedDetailSlot(null);
                              setUnassignConfirmTarget(slot);
                            }}
                            className="text-[10px] font-bold text-rose-600 hover:underline"
                          >
                            ถอดออกจากตำแหน่ง
                          </button>
                        )}
                      </div>
                      <p className="text-emerald-700 dark:text-emerald-300">📞 {selectedDetailSlot.candidatePhone || "-"}</p>
                      {selectedDetailSlot.interviewSchedule && (
                        <p className="text-amber-800 dark:text-amber-300 font-semibold">📅 วันเวลานัดสัมภาษณ์: {selectedDetailSlot.interviewSchedule}</p>
                      )}
                      {selectedDetailSlot.evaluationsCount > 0 && (
                        <div className="mt-3 pt-3 border-t border-emerald-200 dark:border-emerald-800/80 space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 dark:text-slate-200">ผลประเมินสัมภาษณ์เฉลี่ยรวม ({selectedDetailSlot.evaluationsCount} ท่าน):</span>
                            <span className={`px-2 py-0.5 rounded font-extrabold text-[10px] ${
                              selectedDetailSlot.interviewResult === "Pass" ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                            }`}>
                              {selectedDetailSlot.interviewResult} ({selectedDetailSlot.interviewScore}/5 - {selectedDetailSlot.interviewScorePercent}%)
                            </span>
                          </div>
                          {isAdminAuthenticated && (
                            <button
                              onClick={() => {
                                const s = selectedDetailSlot;
                                setSelectedDetailSlot(null);
                                setAdminAuditSlot(s);
                              }}
                              className="text-xs font-bold text-brand-600 hover:underline mt-1"
                            >
                              🔍 เปิดดู Audit Breakdown รายชื่อและคะแนนกรรมการทุกคน &rarr;
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="p-3 text-center bg-slate-50 dark:bg-slate-800 rounded-xl">
                      <p className="text-slate-400 italic">ยังไม่มีผู้สมัครจับคู่ในตำแหน่งนี้</p>
                    </div>
                  )}
                </div>
                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setSelectedDetailSlot(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* Unassign Confirmation Modal */}
          {unassignConfirmTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <h3 className="text-base font-bold text-slate-900 dark:text-white mb-2">ยืนยันการถอดผู้สมัคร</h3>
                <p className="text-xs text-slate-500 mb-4">
                  คุณต้องการถอดคุณ <strong>{unassignConfirmTarget.candidateName}</strong> ออกจากตำแหน่ง Slot #{unassignConfirmTarget.slotId} ใช่หรือไม่?
                </p>
                <div className="flex gap-2 justify-center">
                  <button
                    onClick={() => setUnassignConfirmTarget(null)}
                    className="px-4 py-2 rounded-xl text-xs bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => handleUnassignCandidate(unassignConfirmTarget.slotId, unassignConfirmTarget.candidateName)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700"
                  >
                    ยืนยันถอดออก
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* Delete Candidate Confirmation Modal */}
          {candidateToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-rose-300 dark:border-rose-900 p-6 text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-950/70 text-rose-600 flex items-center justify-center mx-auto text-xl">
                  🗑️
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-slate-900 dark:text-white">
                    ยืนยันการลบข้อมูลผู้สมัคร
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    คุณต้องการลบข้อมูลคุณ <strong>"{candidateToDelete.fullName}"</strong> ({candidateToDelete.candidateId || `#${candidateToDelete.no}`}) ออกจากระบบใช่หรือไม่?
                  </p>
                  {candidateToDelete.assignedSlotId && (
                    <p className="text-[11px] text-amber-700 dark:text-amber-300 font-semibold bg-amber-50 dark:bg-amber-950/40 p-2 rounded-xl mt-2">
                      ⚠️ ผู้สมัครนี้กำลังผูกอยู่กับ Slot #{candidateToDelete.assignedSlotId} ระบบจะปลดการผูกตำแหน่งออกให้อัตโนมัติ
                    </p>
                  )}
                </div>
                <div className="flex gap-2 justify-center pt-2">
                  <button
                    type="button"
                    onClick={() => setCandidateToDelete(null)}
                    className="w-1/2 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 transition"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteCandidate}
                    className="w-1/2 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md shadow-rose-600/30 transition active:scale-95"
                  >
                    ยืนยันการลบ
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* Admin Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <Icon name="lock" className="w-8 h-8 text-brand-600 mx-auto mb-2" />
                <h3 className="text-base font-bold text-slate-900 dark:text-white">Admin Authentication</h3>
                <p className="text-xs text-slate-500 mt-1 mb-4">ระบุรหัสผ่านเพื่อเข้าสู่ Admin Portal (admin123)</p>
                <form onSubmit={handleAdminLoginSubmit} className="space-y-4">
                  <input
                    type="password"
                    autoFocus
                    placeholder="admin123"
                    value={adminPasscode}
                    onChange={(e) => setAdminPasscode(e.target.value)}
                    className="w-full p-2.5 text-sm text-center rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                  />
                  {loginError && <p className="text-xs text-rose-500">{loginError}</p>}
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowLoginModal(false)} className="w-1/2 py-2 rounded-xl text-xs bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="w-1/2 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700">
                      Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
