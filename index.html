  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
              950: '#03192a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Sarabun', 'sans-serif'],
          }
        }
      }

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    body {
      font-family: 'Inter', 'Sarabun', sans-serif;

    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.35);
      border-radius: 9999px;
    }
    .glass-effect {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white">
  <div id="root" class="h-full flex flex-col"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const GOOGLE_SHEET_DIRECTORY_CSV_URL = "https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/gviz/tq?tqx=out:csv&gid=1435033662";
    const GOOGLE_SHEET_CANDIDATES_CSV_URL = "https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/gviz/tq?tqx=out:csv&gid=546067727";
    const CANDIDATES_SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/edit?gid=546067727#gid=546067727";
    const DEFAULT_APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwfdg3PLNPbtKDaWEZ7aeU9MRur3jr7AeJ8wc/exec";
    // Candidate status tags configuration with exact styling
    const CANDIDATE_STATUS_CONFIG = [
      { id: "not suitable", label: "1. not suitable", bg: "bg-rose-100 dark:bg-rose-950/80", text: "text-rose-800 dark:text-rose-200", border: "border-rose-300 dark:border-rose-800", isInactive: true, hideMapping: true },
      { id: "cancel by candidate", label: "2. cancel by candidate", bg: "bg-rose-100 dark:bg-rose-950/80", text: "text-rose-800 dark:text-rose-200", border: "border-rose-300 dark:border-rose-800", isInactive: true, hideMapping: true },
      { id: "Hiring / Offer", label: "3. Hiring / Offer", bg: "bg-[#DCFCE7] dark:bg-emerald-950/80", text: "text-[#166534] dark:text-emerald-200", border: "border-[#BBF7D0] dark:border-emerald-800", isInactive: false, hideMapping: true },
      { id: "Pending", label: "4. Pending", bg: "bg-[#F3E8FF] dark:bg-purple-950/80", text: "text-[#6B21A8] dark:text-purple-200", border: "border-[#E9D5FF] dark:border-purple-800", isInactive: false, hideMapping: false },
      { id: "Compare", label: "5. Compare", bg: "bg-[#E0F2FE] dark:bg-sky-950/80", text: "text-[#0369A1] dark:text-sky-200", border: "border-[#BAE6FD] dark:border-sky-800", isInactive: false, hideMapping: false }
    ];
    const REQUISITION_STATUSES = [
      { id: "PENDING_ADMIN", label: "⏳ รอแอดมินตรวจสอบ (PENDING_ADMIN)", badge: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-300 dark:border-amber-700 font-bold" },
      { id: "PENDING_APPROVER", label: "📧 รอผู้อนุมัติยืนยัน (PENDING_APPROVER)", badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300 border-sky-300 dark:border-sky-700 font-bold" },
      { id: "PENDING_IT", label: "💻 รอ IT ยืนยันอุปกรณ์ (PENDING_IT)", badge: "bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 border-purple-300 dark:border-purple-700 font-bold" },
      { id: "READY_FOR_RECRUITMENT", label: "✅ พร้อมเริ่มสรรหา (READY_FOR_RECRUITMENT)", badge: "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-400 font-extrabold ring-2 ring-emerald-500/20" },
      { id: "Recruiting", label: "Recruiting (อยู่ระหว่างดำเนินการสรรหา)", badge: "bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-200 border-blue-300 dark:border-blue-800" },
      { id: "Closed", label: "Closed (ปิดการสรรหาแล้ว)", badge: "bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border-slate-300 dark:border-slate-700" },
      { id: "REJECTED_BY_ADMIN", label: "❌ ตีกลับ/ปฏิเสธ (REJECTED_BY_ADMIN)", badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800 font-bold" }
    ];
    const ONBOARDING_ARRIVAL_STATUSES = [
      { id: "pending_arrival", label: "⏳ รอถึงวันเริ่มงาน", badge: "bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300 border-amber-300" },
      { id: "arrived_reported", label: "✅ มาเริ่มงานเรียบร้อยแล้ว", badge: "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/80 dark:text-emerald-100 border-emerald-400 font-extrabold ring-2 ring-emerald-500/20" },
      { id: "declined_noshow", label: "❌ สละสิทธิ์ / ไม่มาเริ่มงาน", badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 font-extrabold ring-2 ring-rose-500/30" }
    ];
    // Pipeline stages (Updated to support Approval Workflow & Automatic Transition)
    const STAGES = [
      { id: "received", label: "Request Received", desc: "คำขอรอการอนุมัติ (Pending Approval)" },
      { id: "manpower", label: "1. Manpower Request", desc: "พร้อมสรรหา (Ready for Recruitment)" },
      { id: "interview", label: "Interview Stage", desc: "นัดหมายและสัมภาษณ์ผู้สมัคร" },
      { id: "offer", label: "Offer Sent", desc: "ยื่นข้อเสนอจ้างงาน" },
      { id: "onboarded", label: "Onboarded / Filled", desc: "รับเข้าทำงานและเริ่มงานแล้ว" },
      { id: "cancelled", label: "Cancelled / Rejected", desc: "ยกเลิกคำขอ / ผู้สมัครสละสิทธิ์" }
    ];
    const EVALUATION_CRITERIA = [
      { id: "c1", label: "1. ความรู้ความสามารถและทักษะในสายงาน (Job Competency & Skills)", desc: "ความรู้ ความเชี่ยวชาญ และประสบการณ์ตรงตาม Requirement" },
      { id: "c2", label: "2. การคิดวิเคราะห์และการแก้ปัญหา (Problem Solving & Logic)", desc: "การคิดเป็นระบบ ตรรกะในการวิเคราะห์ และการแก้ไขปัญหาเฉพาะหน้า" },
      { id: "c3", label: "3. ทัศนคติและค่านิยมที่สอดคล้องกับองค์กร (Culture Fit & Values)", desc: "ทัศนคติเชิงบวก ความยืดหยุ่น ความพร้อมรับวัฒนธรรมองค์กร" },
      { id: "c4", label: "4. การสื่อสารและการทำงานร่วมกับผู้อื่น (Communication & Teamwork)", desc: "การสื่อสารกระชับ เข้าใจง่าย รับฟัง และมนุษยสัมพันธ์ในการทำงานร่วมกัน" },
      { id: "c5", label: "5. ความมุ่งมั่นในผลสัมฤทธิ์และการพัฒนาตนเอง (Drive & Adaptability)", desc: "ความกระตือรือร้น ความรับผิดชอบ และการเรียนรู้สิ่งใหม่ต่อเนื่อง" }
    ];
    const EVALUATOR_ROLES = [
      "Hiring Manager (ผู้บังคับบัญชาสายงาน)",
      "Committee Member (กรรมการสัมภาษณ์)",
      "Technical Specialist (ผู้เชี่ยวชาญเฉพาะทาง)",
      "HR Interviewer (ฝ่ายทรัพยากรบุคคล)",
      "Department Director (ผู้อำนวยการฝ่ายงาน)"
    ];
    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;
      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;
      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }
    const STANDARD_SLA_WORKING_DAYS = 30;
    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;
      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }
      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };
    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);
      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };
    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };
    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }
    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);
      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);
      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);
      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);
      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);
      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };
      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }
    const Icon = ({ name, className = "" }) => {
      const hasSize = /\b(w-|h-)/.test(className);
      const finalClass = `${hasSize ? '' : 'w-4 h-4 '} ${className}`.trim();
      switch (name) {
        case "users":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
        case "userSearch":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
        case "checkCircle":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        case "plus":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>;
        case "lock":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>;
        case "shieldCheck":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
        case "sun":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
        case "moon":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>;
        case "search":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
        case "download":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>;
        case "eye":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>;
        case "x":

              ...s,
              slotStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason
            }));
            return {
              ...r,
              requestStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));
        if (selectedRequisitionDetail && selectedRequisitionDetail.id === reqId) {
          setSelectedRequisitionDetail(prev => ({
            ...prev,
            requestStatus: "REJECTED_BY_ADMIN",
            workflowStatus: "REJECTED_BY_ADMIN",
            rejectionReason: reason
          }));
        }
                setShowRejectModal(false);
        setRejectionNoteInput("");
        setRejectTargetReq(null);
        setApproverActionModal(null);

      const handleApproverConfirmAndNotifyIT = async (req) => {
        if (!req) return;
        try {
          setIsNotifyingIT(true);
          setRequests(prev => prev.map(r => {
            if (r.id === req.id) {
              const updatedSlots = (r.slots || []).map(s => ({
                ...s,
                slotStatus: "PENDING_IT",
                workflowStatus: "PENDING_IT"
              }));
              return {
                ...r,
                requestStatus: "PENDING_IT",
                workflowStatus: "PENDING_IT",
                slots: updatedSlots,
                lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
              };
            }
            return r;
          }));
          if (googleScriptUrl) {
            await fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "sendITEmail",
                reqId: req.id,
                jobTitle: req.jobTitle,
                department: req.department,
                headcountRequired: req.headcountRequired || 1,
                targetDate: req.targetDate,
                itRequirements: {
                  laptop: req.itLaptop || "ต้องการ",
                  sim: req.itSimCard || "ไม่ต้องการ",
                  email: req.itEmail || "ต้องการ",
                  netsuite: req.itNetsuite || "ไม่ต้องการ"
                }
              })
            });
          }
          triggerToast(`✅ ยืนยันอนุมัติ ${req.id} เรียบร้อย! ส่งอีเมลแจ้งทีม IT ให้จัดเตรียมอุปกรณ์แล้ว (สถานะ: PENDING_IT)`);
        } catch (err) {
          triggerToast("บันทึกสถานะ PENDING_IT เรียบร้อยแล้ว (ส่งอีเมลไม่สำเร็จ กรุณาแจ้ง IT ด้วยตนเอง)");
        } finally {
          setIsNotifyingIT(false);
          setApproverActionModal(null);

      // NEW: IT กด "ยืนยันรับทราบ" ใน scoped modal -> READY_FOR_RECRUITMENT + auto เข้า Kanban "1. Manpower Request"
      const handleITConfirmAndReady = (req) => {
        if (!req) return;
        setRequests(prev => prev.map(r => {
          if (r.id === req.id) {
            const updatedSlots = (r.slots || []).map(s => ({
              ...s,
              slotStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              stage: (s.stage === "received" || !s.stage) ? "manpower" : s.stage
            }));
            return {
              ...r,
              requestStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              stage: (r.stage === "received" || !r.stage) ? "manpower" : r.stage,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));
        setItActionModal(null);
        triggerToast(`💻 ทีม IT ยืนยันรับทราบอุปกรณ์เรียบร้อย! ย้าย "${req.jobTitle}" (${req.id}) เข้าสู่คอลัมน์ "1. Manpower Request" แล้ว`);

      };

          "Department", "Stage", "Working Days Elapsed", "Total Recruitment Days", "Candidate", "Interview Schedule",
          "Evaluations Count", "Combined Score (1-5)", "Score %", "Result", "Hire Date", "Arrival Status", "Rejection Reason"
        ];

            sla.offerLeadTimeWorkingDays !== null ? sla.offerLeadTimeWorkingDays : sla.workingDaysElapsed,

            s.evaluationsCount || 0,

            `"${s.hireDate || ''}"`, `"${s.onboardingArrivalStatus || ''}"`, `"${s.rejectionReason || ''}"`
          ];

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Manpower_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

                              s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());

                                          ? 'border-rose-300 dark:border-rose-900 bg-rose-50/30 dark:bg-rose-950/20'

                                      <div className="flex items-center justify-between text-[10px] mb-1.5">

                                        <span className="text-slate-400">{item.requestDate}</span>

                                            <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-700">

                                              📧 รอผู้อนุมัติยืนยัน
                                            </span>

                                          {item.workflowStatus === "PENDING_IT" && (
                                            <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 dark:bg-sky-950/80 dark:text-sky-300 border border-sky-300 dark:border-sky-700">
                                              💻 รอ IT จัดเตรียมอุปกรณ์
                                            </span>
                                          )}
                                        </div>
                                      )}
                                      {/* Badge for 1. Manpower Request (Ready for Recruitment) */}
                                      {item.stage === "manpower" && (
                                        <div className="mt-2">
                                          <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-400 ring-1 ring-emerald-500/20">

                                        <div className="mt-2 p-2 rounded-lg bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/60 text-xs">
                                          <div className="font-bold text-emerald-800 dark:text-emerald-300 flex items-center justify-between">
                                            <span className="truncate">👤 {item.candidateName}</span>
                                            <button 
                                              onClick={() => setUnassignConfirmTarget(item)}
                                              className="text-[10px] text-rose-500 hover:text-rose-700 underline font-semibold ml-1 shrink-0"
                                            >
                                              ถอด
                                            </button>
                                          </div>
                                          {item.stage === "interview" && item.interviewSchedule && (
                                            <div className="mt-1.5 pt-1.5 border-t border-emerald-200/60 dark:border-emerald-800/60 text-[11px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1">
                                              <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                              <span className="truncate">นัดหมาย: {item.interviewSchedule}</span>
                                            </div>

                                          {item.stage === "onboarded" && item.hireDate && (
                                            <div className="mt-1.5 pt-1.5 border-t border-emerald-200/60 dark:border-emerald-800/60 text-[11px] text-emerald-800 dark:text-emerald-200 font-bold flex items-center gap-1">
                                              <Icon name="badgeCheck" className="w-3.5 h-3.5 shrink-0 text-emerald-600" />
                                              <span>เริ่มงาน: {item.hireDate}</span>
                                            </div>
                                          )}

                                      ) : (
                                        <div className="mt-2 text-[10px] font-medium text-slate-400 italic bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md inline-block">
                                          👤 ว่าง (Unassigned)
                                        </div>

                                        <div className="mt-2 p-1.5 rounded-lg bg-rose-100/70 dark:bg-rose-950/70 border border-rose-300 dark:border-rose-900 text-[10px] text-rose-800 dark:text-rose-200 font-semibold">

                                          <button
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              handleArchiveSlotFromKanban(item.slotId);
                                            }}
                                            className="inline-flex items-center gap-1 text-[10px] font-bold text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-300 bg-slate-100 hover:bg-rose-50 dark:bg-slate-800/80 dark:hover:bg-rose-950/50 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 transition"

                                        >
                                          {STAGES.map(st => (
                                            <option key={st.id} value={st.id}>{st.label}</option>
                                          ))}
                                        </select>
                                        <button 
                                          onClick={() => setSelectedDetailSlot(item)}
                                          className="text-[10px] font-bold text-brand-600 hover:underline"
                                        >
                                          ดูคำขอ &rarr;
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );

                      </div>
                    </div>
                    {/* Headcount Demand by Department (Admin View) */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">

                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="building" className="w-5 h-5 text-brand-600" />
                            Headcount Demand by Department (Admin Overview)
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">

                          </p>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[440px] overflow-y-auto pr-1">
                        {departmentStats.map((item, idx) => (
                          <div 
                            key={item.department} 
                            onClick={() => setSelectedDepartmentDetail(item.department)}
                            className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:bg-white dark:hover:bg-slate-800 hover:shadow-md transition cursor-pointer flex flex-col justify-between group"

                            <div className="flex items-start justify-between gap-2 mb-2">
                              <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 transition">
                                <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                                {item.department}
                              </span>
                              <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                                <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                                <span className="text-amber-600">Open: {item.open}</span>
                                <span className="text-emerald-600">Filled: {item.filled}</span>
                              </div>
                            </div>
                            <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                              <div 
                                className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full"
                                style={{ width: `${item.total > 0 ? (item.total / (departmentStats[0]?.total || 1)) * 100 : 0}%` }}
                              ></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
                {/* SUB-TAB 3: CANDIDATE POOL & MANPOWER REQUEST */}
                {adminSubTab === "candidates" && (
                  <div className="flex flex-col w-full space-y-8">
                    {/* SECTION 1: Manpower Request (Top - Full Width) */}
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="shieldCheck" className="w-5 h-5 text-emerald-600" />
                            1. Manpower Request
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400">
                            ตารางสรุปคำขอกำลังคน แยกสถานะ In Process (กำลังสรรหา) และ Closed (ปิดแล้ว พร้อมสถานะรายงานตัวที่ล็อกได้และไฮไลท์เขียว/แดง)
                          </p>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={exportToCSV}

                            <Icon name="download" className="w-3.5 h-3.5 text-white" />
                            <span>Export CSV</span>
                          </button>
                        </div>
                      </div>
                      {/* Tab Selection: In Process vs Closed */}

                          onClick={() => setManpowerTableTab("in_process")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "in_process"
                              ? "bg-amber-500 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>⏳ In Process (กำลังสรรหา)</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{inProcessSlots.length}</span>
                        </button>
                        <button
                          onClick={() => setManpowerTableTab("closed")}

                            manpowerTableTab === "closed"
                              ? "bg-emerald-600 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}

                          <span>✅ Closed (ปิดการสรรหาแล้ว)</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{closedSlots.length}</span>
                        </button>
                      </div>
                      {/* Manpower Request Data Table */}
                      <div className="overflow-x-auto max-h-[380px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-500 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">

                              <th className="px-3 py-2.5">Slot / Req</th>
                              <th className="px-3 py-2.5">Status ของ Slot</th>
                              <th className="px-3 py-2.5">ตำแหน่ง &amp; ประเภท</th>
                              <th className="px-3 py-2.5">ฝ่ายงาน</th>
                              <th className="px-3 py-2.5">Recruitment Stage</th>
                              <th className="px-3 py-2.5">Lead Time (วันทำการ)</th>

                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">ระยะเวลาที่ใช้สรรหา (Total Time)</th>}
                              <th className="px-3 py-2.5">ผลประเมินสัมภาษณ์ (Audit)</th>
                              <th className="px-3 py-2.5 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {(manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).length === 0 ? (
                              <tr>
                                <td colSpan={manpowerTableTab === "closed" ? "11" : "9"} className="text-center py-6 text-slate-400 italic">
                                  ไม่มีรายการในหมวดนี้
                                </td>
                              </tr>
                            ) : (
                              (manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).map(s => {
                                const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                                const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
                                const hasEvaluation = s.evaluationsCount > 0;
                                const isPassingScore = s.interviewScorePercent >= 70;
                                const isArrivedSuccess = s.onboardingArrivalStatus === "arrived_reported";
                                const isDeclinedOrCancelled = s.stage === "cancelled" || s.onboardingArrivalStatus === "declined_noshow";
                                const rowHighlightClass = isDeclinedOrCancelled
                                  ? "bg-rose-50/70 dark:bg-rose-950/40 hover:bg-rose-100/80 transition"
                                  : isArrivedSuccess
                                  ? "bg-emerald-50/70 dark:bg-emerald-950/40 hover:bg-emerald-100/80 transition"
                                  : "hover:bg-slate-50/80 dark:hover:bg-slate-800/40";
                                return (
                                  <tr key={s.slotId} className={rowHighlightClass}>
                                    <td className="px-3 py-2.5 font-semibold text-slate-900 dark:text-white">
                                      <span className="text-brand-600 font-bold">{s.slotId}</span>
                                      <div className="text-[10px] text-slate-400">{s.requestDate}</div>
                                    </td>
                                    <td className="px-3 py-2.5">
                                      {s.slotStatus === "PENDING_ADMIN" ? (
                                        <button
                                          onClick={() => {
                                            setSelectedAdminReviewSlot(s);
                                            setShowAdminReviewModal(true);
                                          }}
                                          className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10.5px] font-extrabold bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 dark:bg-amber-950 dark:text-amber-200 dark:border-amber-700 shadow-2xs transition active:scale-95"
                                          title="คลิกเพื่อตรวจสอบและกดยืนยันคำขอ"
                                        >
                                          <span>⏳ PENDING_ADMIN</span>
                                          <span className="text-amber-700 dark:text-amber-300 font-bold underline ml-1">ตรวจ &rarr;</span>
                                        </button>
                                      ) : s.slotStatus === "PENDING_APPROVER" ? (
                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg text-[10.5px] font-bold bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300 border border-sky-300 dark:border-sky-800">
                                          📧 PENDING_APPROVER
                                        </span>
                                      ) : s.slotStatus === "PENDING_IT" ? (
                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg text-[10.5px] font-bold bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 border border-purple-300 dark:border-purple-800">
                                          💻 PENDING_IT
                                        </span>
                                      ) : s.slotStatus === "READY_FOR_RECRUITMENT" ? (
                                        <span className="inline-flex items-center px-2.5 py-0.5 rounded-lg text-[10.5px] font-extrabold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border border-emerald-400 ring-2 ring-emerald-500/20">
                                          ✅ READY_FOR_RECRUITMENT
                                        </span>
                                      ) : (
                                        <select
                                          value={s.slotStatus || "Recruiting"}
                                          onChange={(e) => handleUpdateSlotStatus(s.slotId, e.target.value)}
                                          className={`text-[11px] font-bold px-2 py-1 rounded-lg border ${
                                            s.slotStatus === "Closed"
                                              ? "bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                              : "bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-800"
                                          }`}
                                        >
                                          {REQUISITION_STATUSES.map(st => (
                                            <option key={st.id} value={st.id}>{st.label}</option>
                                          ))}
                                        </select>
                                      )}
                                    </td>
                                    <td className="px-3 py-2.5 font-bold text-slate-900 dark:text-white">
                                      <div>{s.jobTitle}</div>
                                      <div className="text-[10px] font-normal text-slate-400">
                                        {s.positionType}
                                        {s.positionType === "Replacement" && s.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1 font-semibold">(แทน: {s.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2.5">{s.department}</td>
                                    <td className="px-3 py-2.5">
                                      <select
                                        value={s.stage}
                                        onChange={(e) => handleInitiateStageChange(s.slotId, e.target.value)}
                                        className="text-[11px] p-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                                      >
                                        {STAGES.map(stg => (
                                          <option key={stg.id} value={stg.id}>{stg.label}</option>
                                        ))}
                                      </select>
                                    </td>
                                    <td className="px-3 py-2.5">
                                      {s.stage === "offer" ? (
                                        <span className="px-2 py-1 rounded-lg bg-purple-100 text-purple-900 dark:bg-purple-950 dark:text-purple-200 font-bold text-[11px]">
                                          🎯 สรรหาได้ใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                        </span>
                                      ) : (
                                        <span className="text-slate-500 text-[11px]">
                                          ⏱️ {sla.workingDaysElapsed} วันทำการ ({sla.isCompleted ? "Closed" : `เหลือ ${sla.workingDaysRemaining} วัน`})
                                        </span>
                                      )}
                                    </td>
                                    <td className="px-3 py-2.5">
                                      {s.candidateName ? (
                                        <div className="flex flex-col space-y-0.5">
                                          <div className="flex items-center gap-2">
                                            <span className="font-semibold text-slate-900 dark:text-white">{s.candidateName}</span>
                                            {s.candidateNickname && <span className="text-[10px] text-slate-400">({s.candidateNickname})</span>}
                                            <button
                                              onClick={() => setUnassignConfirmTarget(s)}
                                              className="p-1 rounded-md text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-[10px] font-bold"
                                              title="ถอดผู้สมัคร"
                                            >
                                              ✕ ถอด
                                            </button>
                                          </div>
                                          {s.interviewSchedule && (
                                            <div className="text-[10px] text-amber-700 dark:text-amber-300 font-medium">
                                              📅 {s.interviewSchedule}
                                            </div>
                                          )}
                                          {s.rejectionReason && (
                                            <div className="text-[10px] text-rose-700 dark:text-rose-300 font-bold bg-rose-100 dark:bg-rose-950/80 px-2 py-0.5 rounded-md border border-rose-300 dark:border-rose-900 truncate max-w-[200px]" title={s.rejectionReason}>
                                              ❌ เหตุผล: {s.rejectionReason}
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 text-[11px] italic">ว่าง (Unassigned)</span>
                                      )}
                                    </td>
                                    {/* Closed-Tab Specific: Hire Date & Arrival Status with Locking */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="space-y-1">
                                          {isDeclinedOrCancelled ? (
                                            <div className="text-[11px] font-extrabold text-rose-600 dark:text-rose-400 flex items-center gap-1">
                                              <span>❌ ยกเลิก / สละสิทธิ์</span>
                                            </div>
                                          ) : s.hireDate ? (
                                            <div className="text-[11px] font-extrabold text-emerald-800 dark:text-emerald-300 flex items-center gap-1">
                                              <Icon name="calendar" className="w-3 h-3 text-emerald-600" />
                                              <span>วันเริ่มงาน: {s.hireDate}</span>
                                            </div>
                                          ) : (
                                            <div className="text-[10px] text-slate-400 italic">ไม่ระบุวันเริ่มงาน</div>
                                          )}
                                          
                                          <div className="flex items-center gap-1">
                                            <select
                                              disabled={s.onboardingArrivalStatus === "declined_noshow"}
                                              value={s.onboardingArrivalStatus || "pending_arrival"}
                                              onChange={(e) => handleUpdateOnboardingArrivalStatus(s.slotId, e.target.value)}
                                              className={`text-[10px] font-extrabold px-2.5 py-1 rounded-lg border transition ${
                                                s.onboardingArrivalStatus === "declined_noshow"
                                                  ? "bg-rose-600 text-white border-rose-700 shadow-sm ring-2 ring-rose-500/30 cursor-not-allowed opacity-95"
                                                  : s.onboardingArrivalStatus === "arrived_reported"
                                                  ? "bg-emerald-600 text-white border-emerald-700 shadow-sm ring-2 ring-emerald-500/20"
                                                  : "bg-amber-100 text-amber-800 border-amber-300"
                                              }`}
                                            >
                                              {ONBOARDING_ARRIVAL_STATUSES.map(arr => (
                                                <option key={arr.id} value={arr.id}>{arr.label}</option>
                                              ))}
                                            </select>
                                            {s.onboardingArrivalStatus === "declined_noshow" && (
                                              <span className="text-[10px] text-rose-600 font-bold" title="สถานะนี้ถูกล็อกแล้ว">🔒</span>
                                            )}
                                          </div>
                                        </div>
                                      </td>
                                    )}
                                    {/* Closed-Tab Specific: Total Recruitment Duration */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="space-y-0.5">
                                          <div className="text-[11px] font-extrabold text-slate-900 dark:text-white flex items-center gap-1">
                                            <span className="px-2 py-0.5 rounded-md bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 font-bold">
                                              ⏱️ รวม {duration.totalDays} วัน
                                            </span>
                                          </div>
                                          <div className="text-[10px] text-slate-500 dark:text-slate-400 font-medium pl-1">
                                            ({duration.workingDays} วันทำการ)
                                          </div>
                                          <div className="text-[9px] text-slate-400 pl-1 truncate max-w-[170px]" title={duration.rangeText}>
                                            {duration.rangeText}
                                          </div>
                                        </div>
                                      </td>
                                    )}
                                    <td className="px-3 py-2.5">
                                      {s.candidateName || s.stage === "interview" ? (
                                        <div className="flex items-center gap-2">
                                          <button
                                            onClick={() => handleOpenBlindEvaluationModal(s)}
                                            className="px-2.5 py-1 rounded-lg bg-brand-50 hover:bg-brand-100 dark:bg-brand-950 dark:hover:bg-brand-900 text-brand-700 dark:text-brand-300 font-bold text-[11px] flex items-center gap-1 transition"
                                          >
                                            <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-brand-600" />
                                            <span>+ ประเมินเพิ่ม</span>
                                          </button>
                                          {hasEvaluation ? (
                                            <button
                                              onClick={() => setAdminAuditSlot(s)}
                                              className={`px-2.5 py-1 rounded-md text-[10px] font-extrabold flex items-center gap-1 border transition hover:opacity-90 ${
                                                isPassingScore
                                                  ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                                  : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800"
                                              }`}
                                              title="คลิกเพื่อดู Audit Breakdown"
                                            >
                                              <span>⭐ {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน ({isPassingScore ? "ผ่าน" : "ตก"})</span>
                                              <span className="underline ml-0.5">Audit 🔍</span>
                                            </button>
                                          ) : (
                                            <span className="text-[10px] text-slate-400 italic">รอผลประเมิน</span>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 text-[10px] italic">-</span>
                                      )}
                                    </td>
                                    <td className="px-3 py-2.5 text-center">
                                      <button
                                        onClick={() => setSelectedDetailSlot(s)}
                                        className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 text-slate-600 transition"
                                        title="ดูรายละเอียดคำขอ"
                                      >
                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                    {/* SECTION 2: Candidate Pool Directory (Bottom - Full Width, 18 Columns) */}
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                            2. Candidate Pool Directory (18 คอลัมน์ A-R &amp; Two-Way Sheet Sync)
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                            คลังข้อมูลผู้สมัครงานทั้งหมด ซิงค์จาก Google Sheet (GID 546067727) &bull; แคนดิเดตสถานะ not suitable, cancel by candidate, และ Hiring / Offer จะซ่อนปุ่มแมปตำแหน่งอัตโนมัติ
                          </p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            onClick={() => setShowAddCandidateModal(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-brand-500/20 transition active:scale-95"
                          >
                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                            <span>+ เพิ่มผู้สมัครใหม่</span>
                          </button>
                          <button
                            onClick={() => syncCandidatesFromGoogleSheet(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200 transition"
                          >
                            <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                            <span>ซิงค์จาก Sheet</span>
                          </button>
                          <button
                            onClick={() => {
                              setScriptUrlInput(googleScriptUrl);
                              setShowSheetsModal(true);
                            }}
                            className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200 transition"
                            title="ตั้งค่า Google Apps Script Web App URL สำหรับ Two-Way Sync"
                          >
                            <span>⚙️ ตั้งค่า Sync Sheet</span>
                          </button>
                          <a
                            href={CANDIDATES_SHEET_EDIT_URL}
                            target="_blank"
                            rel="noreferrer"
                            className="px-3 py-1.5 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 font-bold text-xs flex items-center gap-1 hover:underline"
                          >
                            <span>เปิด Sheet (GID 546067727)</span>
                            <Icon name="link" className="w-3 h-3 text-sky-600" />
                          </a>
                        </div>
                      </div>
                      {/* Filters: Position and Status */}
                      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-2 text-xs">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">ตำแหน่ง:</span>
                            <select
                              value={candidatePositionFilter}
                              onChange={(e) => setCandidatePositionFilter(e.target.value)}
                              className="px-2.5 py-1 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold max-w-[200px] truncate"
                            >
                              <option value="ALL">ทุกตำแหน่ง (All Positions)</option>
                              {positionFilterOptions.map(pos => (
                                <option key={pos} value={pos}>{pos}</option>
                              ))}
                            </select>
                          </div>
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">สถานะ:</span>
                            <button
                              onClick={() => setSelectedStatusFilter("ALL")}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold transition ${
                                selectedStatusFilter === "ALL"
                                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs"
                                  : "bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                              }`}
                            >
                              All ({candidatePool.length})
                            </button>
                            {CANDIDATE_STATUS_CONFIG.map(st => {
                              const count = candidatePool.filter(c => c.status === st.id).length;
                              return (
                                <button
                                  key={st.id}
                                  onClick={() => setSelectedStatusFilter(st.id)}
                                  className={`px-2 py-1 rounded-xl text-xs font-bold transition border ${st.bg} ${st.text} ${st.border} ${
                                    selectedStatusFilter === st.id ? "ring-2 ring-slate-800 dark:ring-slate-200 shadow-xs" : "opacity-80 hover:opacity-100"
                                  }`}
                                >
                                  <span>{st.label}</span>
                                  <span className="ml-1 px-1.5 py-0.2 rounded-full bg-black/10 text-[10px]">{count}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                        <div className="relative w-full md:w-64">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-3.5 h-3.5" />
                          </div>
                          <input
                            type="text"
                            placeholder="ค้นหาชื่อ, เบอร์โทร, ตำแหน่ง..."
                            value={candidateSearchQuery}
                            onChange={(e) => setCandidateSearchQuery(e.target.value)}
                            className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>
                      {/* 18 Columns Data Table */}
                      <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5 font-bold">Action &amp; Map</th>
                              <th className="px-3 py-2.5 font-bold">No.</th>
                              <th className="px-3 py-2.5 font-bold">ชื่อ-นามสกุล</th>
                              <th className="px-3 py-2.5 font-bold">ชื่อเล่น</th>
                              <th className="px-3 py-2.5 font-bold">Phone</th>
                              <th className="px-3 py-2.5 font-bold">Position (ตำแหน่ง)</th>
                              <th className="px-3 py-2.5 font-bold">Level</th>
                              <th className="px-3 py-2.5 font-bold">Status</th>
                              <th className="px-3 py-2.5 font-bold text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {filteredCandidates.length === 0 ? (
                              <tr>
                                <td colSpan="9" className="text-center py-8 text-slate-400 italic">
                                  ไม่พบข้อมูลผู้สมัครตามเงื่อนไขที่ค้นหา
                                </td>
                              </tr>
                            ) : (
                              filteredCandidates.map((cand, idx) => {
                                const statusCfg = CANDIDATE_STATUS_CONFIG.find(c => c.id === cand.status) || CANDIDATE_STATUS_CONFIG[3];
                                const shouldHideMapping = statusCfg.hideMapping;
                                return (
                                  <tr key={cand.candidateId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                                    <td className="px-3 py-2">
                                      <div className="flex items-center gap-1.5">
                                        {/* 1. ปุ่มดูรายละเอียด/แก้ไข */}
                                        <button
                                          type="button"
                                          onClick={() => handleOpenCandidateDetail(cand)}
                                          className="p-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 dark:bg-sky-950/60 dark:hover:bg-sky-900 text-sky-700 dark:text-sky-300 transition shadow-2xs border border-sky-200 dark:border-sky-800"
                                          title="ดูรายละเอียด / แก้ไขข้อมูล 18 คอลัมน์"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>
                                        {/* 2. ปุ่มแมปตำแหน่ง */}
                                        {cand.assignedSlotId ? (
                                          <div className="flex items-center gap-1">
                                            <span className="px-1.5 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 font-extrabold text-[10px] border border-emerald-300">
                                              ✓ {cand.assignedSlotId}
                                            </span>
                                            <button
                                              onClick={() => handleUnassignCandidate(cand.assignedSlotId, cand.fullName)}
                                              className="text-[10px] text-rose-600 hover:text-rose-800 underline font-semibold shrink-0"
                                              title="Unassign"
                                            >
                                              ถอด
                                            </button>
                                          </div>
                                        ) : shouldHideMapping ? (
                                          <span className="text-[10px] font-semibold italic text-slate-400 dark:text-slate-500">
                                            {cand.status === "Hiring / Offer" ? "✓ บรรจุงานแล้ว" : "(พ้นกระบวนการ)"}
                                          </span>
                                        ) : (
                                          <button
                                            onClick={() => setSlotPickerCandidate(cand)}
                                            className="p-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition shadow-2xs active:scale-95"
                                            title="แมปตำแหน่ง"
                                          >
                                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                                          </button>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2 font-bold text-slate-800 dark:text-slate-200">{cand.no || idx + 1}</td>
                                    <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                      <div className="flex items-center gap-1.5">
                                        <span>{cand.fullName}</span>
                                        {cand.resumeUrl && (
                                          <a
                                            href={cand.resumeUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center gap-0.5 px-1.5 py-0.2 rounded bg-sky-50 dark:bg-sky-950/70 text-sky-600 dark:text-sky-300 border border-sky-200 dark:border-sky-800 text-[9px] font-semibold hover:bg-sky-100 transition shadow-2xs"
                                            title="เปิดดู Google Drive CV / Resume"
                                          >
                                            <Icon name="link" className="w-2.5 h-2.5 text-sky-500" />
                                            <span>CV</span>
                                          </a>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2">{cand.nickname || "-"}</td>
                                    <td className="px-3 py-2">{cand.phone || "-"}</td>
                                    <td className="px-3 py-2 font-semibold text-brand-600 dark:text-brand-400">{cand.targetJobTitle}</td>
                                    <td className="px-3 py-2">{cand.level || "-"}</td>
                                    
                                    <td className="px-3 py-2">
                                      <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-lg border ${statusCfg.bg} ${statusCfg.text} ${statusCfg.border}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>
                                    <td className="px-3 py-2 text-center">
                                      <button
                                        type="button"
                                        onClick={() => setCandidateToDelete(cand)}
                                        className="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 font-bold text-[11px] border border-rose-200 dark:border-rose-800 transition active:scale-95 shadow-2xs cursor-pointer"
                                        title="ลบข้อมูลผู้สมัครรายนี้"
                                      >
                                        <span>🗑️ ลบ</span>
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
