    const EVALUATOR_ROLES = [
      "Hiring Manager (ผู้บังคับบัญชาสายงาน)",
      "Committee Member (กรรมการสัมภาษณ์)",
      "Technical Specialist (ผู้เชี่ยวชาญเฉพาะทาง)",
      "HR Interviewer (ฝ่ายทรัพยากรบุคคล)",
      "Department Director (ผู้อำนวยการฝ่ายงาน)"
    ];

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

        case "lock":

        case "shieldCheck":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
        case "sun":
          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;

          return <svg className={finalClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>;
        case "x":

              stage: "cancelled",
              rejectionReason: reason,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        if (selectedRequisitionDetail && selectedRequisitionDetail.id === reqId) {
          setSelectedRequisitionDetail(prev => ({
            ...prev,
            requestStatus: "REJECTED_BY_ADMIN",
            workflowStatus: "REJECTED_BY_ADMIN",
            rejectionReason: reason
          }));
        }

        setShowRejectModal(false);
        setRejectionNoteInput("");
        triggerToast(`❌ ตีกลับคำขอ ${reqId} เรียบร้อยแล้ว`);
      };

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPasscode === "admin123" || adminPasscode === "hr2025") {
          setIsAdminAuthenticated(true);
          setShowLoginModal(false);
          setCurrentView("admin");
          setAdminPasscode("");
          setLoginError("");
          triggerToast("เข้าสู่ระบบ Admin เรียบร้อย");
        } else {
          setLoginError("รหัสผ่านไม่ถูกต้อง (ทดสอบ: admin123)");
        }
      };

      const handleCopyShareLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const textArea = document.createElement("textarea");
        textArea.value = baseUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        triggerToast("คัดลอกลิงก์สำเร็จ! 🔗");
      };

      const exportToCSV = () => {
        const headers = [
          "Slot ID", "Request ID", "Date", "Slot Status", "Job Title", "Position Type", "Replaced Name",
          "Department", "Stage", "Working Days Elapsed", "Total Recruitment Days", "Candidate", "Interview Schedule",
          "Evaluations Count", "Combined Score (1-5)", "Score %", "Result", "Hire Date", "Arrival Status", "Rejection Reason"
        ];
        const rows = allPositionSlots.map(s => {
          const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
          const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
          return [
            s.slotId, s.id, s.requestDate, s.slotStatus, `"${s.jobTitle}"`, s.positionType,
            `"${s.replacedEmployeeName || ''}"`, `"${s.department}"`, s.stage,
            sla.offerLeadTimeWorkingDays !== null ? sla.offerLeadTimeWorkingDays : sla.workingDaysElapsed,
            duration.totalDays,
            `"${s.candidateName || ''}"`, `"${s.interviewSchedule || ''}"`,
            s.evaluationsCount || 0,
            s.interviewScore || "", s.interviewScorePercent ? `${s.interviewScorePercent}%` : "", s.interviewResult || "",
            `"${s.hireDate || ''}"`, `"${s.onboardingArrivalStatus || ''}"`, `"${s.rejectionReason || ''}"`
          ];
        });
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Manpower_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-normal mt-0.5">
                      ระบบติดตามการสรรหา & SLA Lead Time (เป้าหมาย 30 วันทำการ - Exclude Weekends)
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {
                        if (isAdminAuthenticated) setCurrentView("admin");
                        else setShowLoginModal(true);
                      }}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Admin Portal</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setCurrentView("public")}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition"
                      >
                        <Icon name="grid" className="w-3.5 h-3.5" />
                        <span>Public View</span>
                      </button>
                      <button
                        onClick={() => {
                          setIsAdminAuthenticated(false);
                          setCurrentView("public");
                          triggerToast("ออกจากระบบ Admin เรียบร้อย");
                        }}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 transition"
                      >
                        <span>Logout</span>
                      </button>
                    </div>
                  )}

                  <button
                    onClick={() => setShowRequestModal(true)}
                    className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition"
                  >
                    <Icon name="plus" className="w-4 h-4 text-white" />
                    <span>+ ขอกำลังคน</span>
                  </button>

                  <button
                    onClick={handleCopyShareLink}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                    title="คัดลอกลิงก์"
                  >
                    <Icon name="link" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">อัตราทั้งหมด</p>
                  <p className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{allPositionSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">กำลังดำเนินการ</p>
                  <p className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{inProcessSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ปิดการสรรหาแล้ว</p>
                  <p className="text-xl sm:text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{closedSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ผู้สมัครในคลัง</p>
                  <p className="text-xl sm:text-2xl font-bold text-sky-600 dark:text-sky-400 mt-1">{candidatePool.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-950 text-sky-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                </div>
              </div>
            </div>

            {currentView === "public" && (
              <div className="space-y-8">
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="grid" className="w-5 h-5 text-amber-600" />
                        Recruitment Stage Tracker
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        ติดตามสถานะการสรรหาแยกตาม 5 ขั้นตอนหลัก (SLA 30 วันทำการ ไม่รวมเสาร์-อาทิตย์) &bull; กรรมการสามารถกดร่วมประเมินสัมภาษณ์ได้ทันที
                      </p>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        placeholder="ค้นหาตำแหน่ง, รหัส, ฝ่ายงาน, ผู้สมัคร..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = allPositionSlots.filter(s => {
                        const matchesQuery = !searchQuery.trim() || 
                          s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                        return s.stage === stage.id && !s.isArchivedFromKanban && matchesQuery;
                      });

                      return (
                        <div key={stage.id} className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border border-slate-200/60 dark:border-slate-800">
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{stage.label}</span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px]">
                            {stageItems.map(item => {
                              const sla = getSLAInfo(item.requestDate, item.stage, item.offerSentDate);
                              const hasEvaluation = item.evaluationsCount > 0;
                              const isPassingScore = item.interviewScorePercent >= 70;

                              return (
                                <div key={item.slotId} className="p-3.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 shadow-xs hover:border-brand-500 transition group">
                                  <div className="flex items-center justify-between text-[10px] mb-1.5">
                                    <span className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded-md">
                                      Slot #{item.slotIndex}/{item.totalSlots}
                                    </span>
                                    <span className="text-slate-400 text-[10px]">{item.requestDate}</span>
                                  </div>
                                  <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                    {item.jobTitle}
                                  </h4>
                                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 truncate">
                                    {item.department}
                                  </p>

                                  {item.stage === "received" && (
                                    <div className="mt-2">
                                      {item.workflowStatus === "PENDING_ADMIN" && (
                                        <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-700">
                                          <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
                                          ⏳ รอ Admin ตรวจสอบ
                                        </span>
                                      )}
                                      {item.workflowStatus === "PENDING_APPROVER" && (
                                        <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-orange-100 text-orange-800 dark:bg-orange-950/80 dark:text-orange-300 border border-orange-300 dark:border-orange-700">
                                          📧 รอผู้อนุมัติยืนยัน
                                        </span>
                                      )}
                                      {item.workflowStatus === "PENDING_IT" && (
                                        <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 dark:bg-sky-950/80 dark:text-sky-300 border border-sky-300 dark:border-sky-700">
                                          💻 รอ IT จัดเตรียมอุปกรณ์
                                        </span>
                                      )}
                                    </div>
                                  )}

                                  {item.stage === "manpower" && (
                                    <div className="mt-2">
                                      <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-400 font-bold ring-1 ring-emerald-500/20">
                                        ✅ พร้อมสรรหา
                                      </span>
                                    </div>
                                  )}

                                  {item.candidateName && (
                                    <div className="mt-2 p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/60 text-[11px] text-emerald-800 dark:text-emerald-300 font-semibold truncate">
                                      👤 {item.candidateName}
                                    </div>
                                  )}

                                  {item.stage === "interview" && item.interviewSchedule && (
                                    <div className="mt-1.5 text-[10px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1">
                                      <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                      <span className="truncate">นัดหมาย: {item.interviewSchedule}</span>
                                    </div>
                                  )}

                                  {item.stage === "onboarded" && item.hireDate && (
                                    <div className="mt-1.5 text-[10px] text-emerald-700 dark:text-emerald-300 font-bold flex items-center gap-1">
                                      <Icon name="badgeCheck" className="w-3.5 h-3.5 shrink-0" />
                                      <span>วันเริ่มงาน: {item.hireDate}</span>
                                    </div>
                                  )}

                                  {item.rejectionReason && (
                                    <div className="mt-1.5 p-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-[10px] text-rose-700 dark:text-rose-300 font-medium">
                                      ❌ เหตุผล: {item.rejectionReason}
                                    </div>
                                  )}

                                  {hasEvaluation && (
                                    <div className="mt-2 p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-[10px] flex items-center justify-between">
                                      <span className="font-bold text-slate-700 dark:text-slate-200">
                                        ⭐ คะแนนเฉลี่ย: {item.interviewScore}/5 ({item.interviewScorePercent}%)
                                      </span>
                                      <span className={`px-1.5 py-0.5 rounded font-extrabold text-[9px] ${
                                        isPassingScore ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300" : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300"
                                      }`}>
                                        {isPassingScore ? "ผ่าน (Pass)" : "ไม่ผ่าน"}
                                      </span>
                                    </div>
                                  )}

                                  <div className="mt-2 text-[10px] font-semibold">
                                    {item.stage === "offer" ? (
                                      <span className="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300">
                                        ⏱️ สรรหาเสร็จใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                      </span>
                                    ) : sla.isCompleted ? (
                                      <span className="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                        ⏱️ ปิดตำแหน่งใน: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : sla.isOverdue ? (
                                      <span className="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 animate-pulse">
                                        ⚠️ เกิน SLA: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : (
                                      <span className="px-2 py-0.5 rounded-md bg-sky-50 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">
                                        ⏱️ {sla.workingDaysElapsed} วันทำการ (เหลือ {sla.workingDaysRemaining} วัน)
                                      </span>
                                    )}
                                  </div>

                                  {(item.candidateName || item.stage === "interview") && (
                                    <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                                      <button
                                        onClick={() => handleOpenBlindEvaluationModal(item)}
                                        className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-600 hover:text-brand-700 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/60 px-2 py-1 rounded-lg border border-brand-200 dark:border-brand-800/80 transition"
                                      >
                                        <Icon name="clipboardCheck" className="w-3 h-3 text-brand-600" />
                                        <span>+ ร่วมประเมินสัมภาษณ์</span>
                                      </button>
                                      <span className="text-[10px] text-slate-400">
                                        {item.evaluationsCount > 0 ? `(${item.evaluationsCount} ท่านประเมินแล้ว)` : "รอประเมิน"}
                                      </span>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="building" className="w-5 h-5 text-brand-600" />
                        Headcount Demand by Department
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        สรุปภาพรวมจำนวนอัตรากำลังคนที่เปิดรับสมัครจำแนกตามฝ่ายงาน &bull; คลิกที่ฝ่ายงานเพื่อดูตำแหน่งงานที่เปิดรับ
                      </p>
                    </div>

                    <div className="flex items-center gap-2 text-xs">
                      <select
                        value={selectedMonthFilter}
                        onChange={(e) => setSelectedMonthFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Months</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                      </select>
                      <select
                        value={selectedYearFilter}
                        onChange={(e) => setSelectedYearFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Years</option>
                        <option value="2026">2026</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[440px] overflow-y-auto pr-1">
                    {departmentStats.map((item, idx) => {
                      const maxTotal = departmentStats[0]?.total || 1;
                      const percent = Math.min(100, Math.round((item.total / maxTotal) * 100));

                      return (
                        <div 
                          key={item.department} 
                          onClick={() => setSelectedDepartmentDetail(item.department)}

                      >

                        <div className="text-xl font-extrabold text-sky-700 dark:text-sky-300 mt-1 flex items-center justify-between">
                          <span>{requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_APPROVER").length}</span>
                          <span className="text-sm">📧</span>
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("PENDING_IT")}
                        className={`p-3.5 rounded-2xl border transition cursor-pointer ${
                          reqQueueFilter === "PENDING_IT"
                            ? "bg-purple-100/90 dark:bg-purple-950/70 border-purple-400 ring-2 ring-purple-500/20"
                            : "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-purple-300"
                        }`}
                      >
                        <span className="text-[10px] font-bold text-purple-600 uppercase">รอ IT ยืนยัน</span>

                          <span className="text-sm">💻</span>
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}

                          <span>{requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length}</span>

                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                        className={`p-3.5 rounded-2xl border transition cursor-pointer ${
                          reqQueueFilter === "REJECTED_BY_ADMIN"
                            ? "bg-rose-100/90 dark:bg-rose-950/70 border-rose-400 ring-2 ring-rose-500/20"
                            : "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-rose-300"

                      >

                        <div className="text-xl font-extrabold text-rose-700 dark:text-rose-300 mt-1 flex items-center justify-between">
                          <span>{requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length}</span>

                            reqQueueFilter === "ALL"
                              ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          ทั้งหมด ({requests.length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                          className={`px-3 py-1.5 rounded-xl font-bold transition border ${

                              ? "bg-amber-100 text-amber-900 border-amber-400 dark:bg-amber-950 dark:text-amber-200 ring-2 ring-amber-500/20"
                              : "bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300"
                          }`}
                        >
                          ⏳ รอแอดมินตรวจ ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("PENDING_APPROVER")}
                          className={`px-3 py-1.5 rounded-xl font-bold transition border ${
                            reqQueueFilter === "PENDING_APPROVER"
                              ? "bg-sky-100 text-sky-900 border-sky-400 dark:bg-sky-950 dark:text-sky-200 ring-2 ring-sky-500/20"
                              : "bg-sky-50 text-sky-800 border-sky-200 dark:bg-sky-950/40 dark:text-sky-300"
                          }`}
                        >
                          📧 รอผู้อนุมัติ ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_APPROVER").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                          className={`px-3 py-1.5 rounded-xl font-bold transition border ${

                              ? "bg-emerald-100 text-emerald-900 border-emerald-400 dark:bg-emerald-950 dark:text-emerald-200 ring-2 ring-emerald-500/20"
                              : "bg-emerald-50 text-emerald-800 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300"
                          }`}
                        >
                          ✅ พร้อมเริ่มสรรหา ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length})
                        </button>

                          onChange={(e) => setReqQueueSearch(e.target.value)}
                          className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                    </div>

                        <div>
                          <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="clipboardCheck" className="w-4 h-4 text-brand-600" />
                            <span>ตารางคำขอกำลังคนทั้งหมด (เรียงลำดับ PENDING_ADMIN ขึ้นก่อน)</span>
                          </h3>
                          <p className="text-[11px] text-slate-400 mt-0.5">
                            คลิกที่แถวรายการเพื่อเปิดดูรายละเอียดฉบับเต็มและกดยืนยันอนุมัติหรือตีกลับ
                          </p>
                        </div>
                        <span className="text-xs font-bold text-slate-500 dark:text-slate-400">

                          <thead className="bg-slate-50 dark:bg-slate-800/60 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-4 py-3 font-bold">วันที่ขอ (Request Date)</th>
                              <th className="px-4 py-3 font-bold">รหัสคำขอ</th>
                              <th className="px-4 py-3 font-bold">ชื่อผู้ขอ (Requester)</th>
                              <th className="px-4 py-3 font-bold">ตำแหน่งที่ขอ (Job Title)</th>
                              <th className="px-4 py-3 font-bold">ฝ่าย/แผนก</th>
                              <th className="px-4 py-3 font-bold">จำนวน</th>
                              <th className="px-4 py-3 font-bold">สถานะ (Status)</th>
                              <th className="px-4 py-3 font-bold text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {sortedAdminRequisitions.length === 0 ? (
                              <tr>
                                <td colSpan="8" className="text-center py-10 text-slate-400 italic">
                                  ไม่พบรายการคำขอกำลังคนตามเงื่อนไขที่เลือก
                                </td>
                              </tr>
                            ) : (
                              sortedAdminRequisitions.map((req) => {
                                const currentStatus = req.requestStatus || req.workflowStatus || "PENDING_ADMIN";
                                const isPendingAdmin = currentStatus === "PENDING_ADMIN";
                                const statusCfg = REQUISITION_STATUSES.find(s => s.id === currentStatus) || REQUISITION_STATUSES[0];

                                return (
                                  <tr 
                                    key={req.id}
                                    onClick={() => setSelectedRequisitionDetail(req)}
                                    className={`cursor-pointer transition ${
                                      isPendingAdmin
                                        ? "bg-amber-50/70 hover:bg-amber-100/80 dark:bg-amber-950/20 dark:hover:bg-amber-950/40"
                                        : "hover:bg-slate-50 dark:hover:bg-slate-800/40"
                                    }`}
                                  >
                                    <td className="px-4 py-3 font-medium text-slate-500 dark:text-slate-400">
                                      <div className="flex items-center gap-1.5">
                                        {isPendingAdmin && (
                                          <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                                        )}
                                        <span>{req.requestDate}</span>
                                      </div>
                                    </td>

                                    <td className="px-4 py-3 font-mono font-bold text-brand-600 dark:text-brand-400">
                                      {req.id}
                                    </td>

                                    <td className="px-4 py-3 font-semibold text-slate-900 dark:text-white">
                                      <div>{req.requesterName}</div>
                                      <div className="text-[10px] font-normal text-slate-400">{req.requesterPosition || "-"}</div>
                                    </td>

                                    <td className="px-4 py-3 font-bold text-slate-900 dark:text-white">
                                      <div>{req.jobTitle}</div>
                                      <div className="text-[10px] font-normal text-slate-400">

                                        {req.positionType === "Replacement" && req.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1">(แทน: {req.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>

                                    <td className="px-4 py-3 text-slate-700 dark:text-slate-300">
                                      {req.department}
                                    </td>

                                    <td className="px-4 py-3 font-bold text-center">
                                      <span className="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                                        {req.headcountRequired || 1}
                                      </span>
                                    </td>

                                    <td className="px-4 py-3">
                                      <span className={`inline-flex items-center px-2.5 py-1 rounded-xl text-[11px] border ${statusCfg.badge}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>

                                    <td className="px-4 py-3 text-center" onClick={(e) => e.stopPropagation()}>
                                      {isPendingAdmin ? (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="px-3 py-1 rounded-xl text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-sm transition active:scale-95 flex items-center gap-1 mx-auto"
                                        >
                                          <span>ตรวจ &rarr;</span>
                                        </button>
                                      ) : (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="p-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-600 dark:text-slate-300 transition"
                                          title="ดูรายละเอียดคำขอ"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>

                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="grid" className="w-5 h-5 text-brand-600" />

                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">

                          </p>
                        </div>

                            >
                              <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                              <span>กู้คืนการ์ดที่ซ่อน ({allPositionSlots.filter(s => s.isArchivedFromKanban).length})</span>
                            </button>
                          )}

                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                              <Icon name="search" className="w-4 h-4" />
                            </div>
                            <input
                              type="text"
                              placeholder="ค้นหาตำแหน่ง, รหัส, ฝ่ายงาน, ผู้สมัคร..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                        {STAGES.map(stage => {
                          const stageItems = allPositionSlots.filter(s => {
                            const matches = !searchQuery.trim() ||
                              s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                            return s.stage === stage.id && !s.isArchivedFromKanban && matches;
                          });

                          return (
                            <div
                              key={stage.id}
                              onDragOver={(e) => handleDragOver(e, stage.id)}
                              onDragLeave={(e) => handleDragLeave(e, stage.id)}
                              onDrop={(e) => handleDrop(e, stage.id)}
                              className={`w-72 shrink-0 snap-start flex flex-col rounded-2xl p-3 border-2 transition-all duration-150 ${
                                dragOverStage === stage.id
                                  ? 'border-brand-500 bg-brand-50/70 dark:bg-brand-950/50 ring-2 ring-brand-500/20'
                                  : draggedSlotId
                                  ? 'border-dashed border-slate-300 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-800/30'
                                  : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40'
                              }`}
                            >
                              <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700 gap-1.5">
                                <div className="flex items-center gap-1.5 truncate">
                                  <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">{stage.label}</span>
                                  <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs">
                                    {stageItems.length}
                                  </span>
                                </div>

                                {(stage.id === "onboarded" || stage.id === "cancelled") && stageItems.length > 0 && (
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleOpenStageClearModal(stage.id, stage.label);
                                    }}
                                    className="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/60 text-slate-600 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-300 border border-slate-200 dark:border-slate-700 transition shadow-2xs shrink-0 active:scale-95"
                                    title={`ล้างการ์ดในด่าน ${stage.label}`}
                                  >
                                    <span>🧹 ล้างการ์ด</span>
                                  </button>
                                )}
